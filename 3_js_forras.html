<!DOCTYPE html>

<head>

    <title>JavaScript Unit teszt feladat</title>
	<script type="text/javascript">
	<!-- Ide jön  a feladat megoldása... -->


		function kivalogatParosOtven(tomb){
			var elemek = [];
			for (var i = 0; i < tomb.length; i++){
				if (tomb[i] > 50 && tomb[i] % 2 == 0){
					elemek.push(tomb[i]);
				} 
			}
			return elemek;
		}
		console.log(kivalogatParosOtven([10, 20, 3, 5, 100, 50, 60, 53]));


		function aBetukSzamaDiv(){
			var elsoDiv = document.querySelector('div').innerText;
			var db = 0;
			for (var i = 0; i < elsoDiv.length; i++){
				if (elsoDiv[i] =="a"){
					db++;
				}
			}
			return db;
		}


		function osszeadasFeliras(osztaly, a, b){
			var elem = document.getElementsByClassName(osztaly)[0];
			
			var szam1 = Number(a);
			var szam2 = Number(b);

			var osszeg = szam1 + szam2;

			var paragrafus = document.createElement('p');

			paragrafus.textContent = szam1 + '+' + szam2 + '=' + osszeg;

			elem.appendChild(paragrafus);
		}		


		<!-- Idáig -->
	</script>
	<script src="testBaseUnit.js"></script>
</head>
